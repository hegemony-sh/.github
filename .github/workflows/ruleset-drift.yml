# The organization rulesets recorded under rulesets/ are compared with the
# live ones, so the recorded policy cannot quietly diverge from the enforced
# one. The platform repository, hegemony-sh/hegemony, checks its own
# repository rulesets the same way, with the same checker and tests;
# rulesets/README.md explains both.

name: Organization ruleset drift

on:
  pull_request:
    paths:
      - .github/workflows/ruleset-drift.yml
      - rulesets/**
      - scripts/check_ruleset_drift.py
      - tests/**
  push:
    branches: [main]
    paths:
      - .github/workflows/ruleset-drift.yml
      - rulesets/**
      - scripts/check_ruleset_drift.py
      - tests/**
  schedule:
    # Daily at 06:17 UTC, the same time as the platform repository's check.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruleset-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate drift checker and recorded rulesets
    # GitHub-hosted on purpose: this repository is public and this job runs
    # on pull requests, a fork's included, so the code it runs must not reach
    # the organization's self-hosted runners. The live comparison below runs
    # main only and selects CI_RUNNER like the platform repository's workflows.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The checker and its tests use the standard library only, so the
      # system interpreter does.
      - name: Test the drift checker
        run: python3 -m unittest tests/test_ruleset_drift.py -v

      - name: Validate recorded rulesets
        run: python3 scripts/check_ruleset_drift.py --org "${GITHUB_REPOSITORY_OWNER}" --validate-only

  drift:
    name: Compare live organization rulesets
    needs: validate
    # Organization credentials are available only to the main-branch monitor.
    # Pull requests (including forks) run the offline checks above.
    if: >-
      github.repository == 'hegemony-sh/.github' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Compare live organization rulesets
        env:
          ORG_RULESETS_TOKEN: ${{ secrets.ORG_RULESETS_TOKEN }}
        run: python3 scripts/check_ruleset_drift.py --org "${GITHUB_REPOSITORY_OWNER}"
